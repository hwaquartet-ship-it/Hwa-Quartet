<!DOCTYPE html>

      .font-sans-body { font-family: 'Raleway', sans-serif; }

<script id="tailwind-config">
      tailwind.config = {

        theme: {
          extend: {
            colors: {
              "primary": "#D9B5A3",
              "background-light": "#FAF7F2",

              "text-subtle-dark": "#b0a399",

<div class="flex-1 min-w-0">
<p class="text-text-light dark:text-text-dark text-lg font-bold leading-tight truncate">Canon in D</p>
<p class="text-text-subtle-light dark:text-text-subtle-dark text-sm font-normal leading-normal truncate">Pachelbel</p>
</div>
<button class="flex shrink-0 items-center justify-center rounded-full size-12 bg-primary text-background-dark hover:bg-opacity-90 transition-colors">

<div class="h-1.5 flex-1 rounded-full bg-primary/30">

</div>
<div class="absolute" style="left: 50%;">
<div class="relative -ml-2">
<div class="size-4 rounded-full bg-primary ring-2 ring-background-light dark:ring-background-dark"></div>
</div>
</div>
</div>

<p class="text-text-subtle-light dark:text-text-subtle-dark text-xs font-medium leading-normal">1:17</p>

</div>
</div>
</div>
<!-- BodyText for Description -->
<p class="text-text-light dark:text-text-dark text-base font-normal leading-normal pb-6 pt-4 px-4 text-center">

                    </p>
<!-- SingleButton -->
<div class="flex px-4 py-3 justify-center">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-8 bg-primary text-background-dark text-base font-bold leading-normal tracking-wide hover:bg-opacity-90 transition-colors">

</button>

</div>
